<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turnos de peluquería</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--surf:#fff;--ink:#14213d;--mut:#55627d;--line:#d5dbe8;--acc:#d7263d;--blue:#1b4f9c;--on:#fff;--soft:#e6ebf5;--bad:#b4231a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--surf:#162036;--ink:#eef2fb;--mut:#9fb0cf;--line:#2b3b5c;--acc:#ff5468;--blue:#78a8f5;--on:#fff;--soft:#1d2a47;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1526;--surf:#162036;--ink:#eef2fb;--mut:#9fb0cf;--line:#2b3b5c;--acc:#ff5468;--blue:#78a8f5;--on:#fff;--soft:#1d2a47;--bad:#ff8a80;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
.pole{height:12px;background:repeating-linear-gradient(-45deg,var(--acc) 0 12px,#fff 12px 24px,var(--blue) 24px 36px,#fff 36px 48px)}
.wrap{max-width:620px;margin:0 auto;padding:22px 18px 40px}
h1{font:800 clamp(34px,9vw,48px)/1 Archivo,system-ui,sans-serif;font-stretch:80%;letter-spacing:-.02em;margin:0 0 6px}
.lead{margin:0 0 18px;color:var(--mut)}
nav{display:flex;gap:6px;margin-bottom:6px}
nav button{border:2px solid var(--ink);background:none;color:var(--ink);font:600 15px Archivo,system-ui,sans-serif;padding:8px 16px;border-radius:8px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
h2{display:flex;align-items:center;gap:10px;font:700 19px Archivo,system-ui,sans-serif;margin:28px 0 10px}
h2 i{font-style:normal;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--on);font-size:14px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.chip{border:2px solid var(--line);background:var(--surf);color:var(--ink);font:600 16px Archivo,system-ui,sans-serif;border-radius:10px;padding:9px 14px;cursor:pointer;min-height:58px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;transition:border-color .15s,background .15s}
.chip small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.chip{text-decoration:none}
.chip:hover:not(:disabled){border-color:var(--blue)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on small{color:var(--bg);opacity:.8}
.chip:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.grid .chip{min-height:48px}
label{display:block;font-size:14px;font-weight:600;color:var(--mut);margin-bottom:12px}
input{width:100%;margin-top:5px;background:var(--surf);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:400 16px Archivo,system-ui,sans-serif;min-height:48px}
input:focus,textarea:focus{border-color:var(--blue)}
textarea{display:block;width:100%;margin-top:5px;background:var(--surf);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:400 16px Archivo,system-ui,sans-serif;min-height:84px;resize:vertical}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.go{width:100%;border:0;background:var(--acc);color:var(--on);font:700 17px Archivo,system-ui,sans-serif;border-radius:10px;padding:15px;cursor:pointer;margin-top:6px}
.go:disabled{opacity:.5}
.card{background:var(--surf);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{flex-wrap:wrap}
.wa{border:2px solid var(--blue);color:var(--blue);border-radius:8px;padding:6px 10px;font:600 14px Archivo,system-ui,sans-serif;text-decoration:none}
.card b{display:block;font-size:17px}
.sm{font-size:14px;color:var(--mut)}
.x{border:2px solid var(--line);background:none;color:var(--bad);border-radius:8px;padding:6px 10px;font:600 14px Archivo,system-ui,sans-serif;cursor:pointer}
.err{color:var(--bad);font-weight:600;min-height:20px;margin:6px 0 0}
.ok{background:var(--surf);border:2px solid var(--ink);border-radius:14px;padding:0 0 20px;text-align:center;overflow:hidden;margin-top:18px}
.ok .pole{margin-bottom:20px}
.ok h2{justify-content:center;margin-top:0;font-size:28px;font-stretch:85%}
.note{background:var(--soft);border-radius:10px;padding:14px;color:var(--mut)}
.day{text-transform:capitalize;font-size:17px;margin:24px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--acc);color:var(--on);border-radius:10px;padding:12px 14px;margin:12px 0;font-weight:600}
.alert button{border:2px solid var(--on);background:none;color:var(--on);border-radius:8px;padding:4px 10px;font:600 14px Archivo,system-ui,sans-serif;cursor:pointer}
.col{flex-direction:column;align-items:stretch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input,.row label{flex:1 1 120px}
.row input,select{margin:0;width:auto;background:var(--surf);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 10px;font:400 16px Archivo,system-ui,sans-serif;min-height:44px}
.row select{flex:1 1 110px}
.sw{display:flex;align-items:center;gap:8px;color:var(--ink);margin:0}
.sw input[type=checkbox]{width:22px;height:22px;min-height:0;margin:0;flex:none}
.wrap{position:relative}
h1{padding-right:40px}
.own{position:absolute;top:8px;right:6px;width:44px;height:44px;display:grid;place-items:center;background:none;border:0;border-radius:50%;color:var(--mut);opacity:.4;cursor:pointer;padding:0}
.own:hover,.own:focus-visible{opacity:1}
.own svg{width:20px;height:20px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

          if(seen){const n=books.filter(b=>!seen.has(b.id));if(n.length){alertMsg='Nuevo turno: '+n.map(b=>b.name+', '+b.service+', '+b.date.split('-').reverse().slice(0,2).join('/')+' '+b.time+' hs').join(' | ');try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}}
          seen=ids;render()},()=>{});
      }else{books=[];seen=null;alertMsg='';if(tab==='adm'||tab==='cfg')tab='res'}
      render();
    });
  }catch(e){db=null}
  ready=true;render();
})();
render();
</script>
</body>
</html>
