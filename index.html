<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turnos de peluquería</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--surf:#fff;--ink:#14213d;--mut:#55627d;--line:#d5dbe8;--acc:#d7263d;--blue:#1b4f9c;--on:#fff;--soft:#e6ebf5;--bad:#b4231a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--surf:#162036;--ink:#eef2fb;--mut:#9fb0cf;--line:#2b3b5c;--acc:#ff5468;--blue:#78a8f5;--on:#fff;--soft:#1d2a47;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1526;--surf:#162036;--ink:#eef2fb;--mut:#9fb0cf;--line:#2b3b5c;--acc:#ff5468;--blue:#78a8f5;--on:#fff;--soft:#1d2a47;--bad:#ff8a80;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
.pole{height:12px;background:repeating-linear-gradient(-45deg,var(--acc) 0 12px,#fff 12px 24px,var(--blue) 24px 36px,#fff 36px 48px)}
.wrap{max-width:620px;margin:0 auto;padding:22px 18px 40px}
h1{font:800 clamp(34px,9vw,48px)/1 Archivo,system-ui,sans-serif;font-stretch:80%;letter-spacing:-.02em;margin:0 0 6px}
.lead{margin:0 0 18px;color:var(--mut)}
nav{display:flex;gap:6px;margin-bottom:6px}
nav button{border:2px solid var(--ink);background:none;color:var(--ink);font:600 15px Archivo,system-ui,sans-serif;padding:8px 16px;border-radius:8px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
h2{display:flex;align-items:center;gap:10px;font:700 19px Archivo,system-ui,sans-serif;margin:28px 0 10px}
h2 i{font-style:normal;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--on);font-size:14px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.chip{border:2px solid var(--line);background:var(--surf);color:var(--ink);font:600 16px Archivo,system-ui,sans-serif;border-radius:10px;padding:9px 14px;cursor:pointer;min-height:58px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;transition:border-color .15s,background .15s}
.chip small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.chip{text-decoration:none}
.chip:hover:not(:disabled){border-color:var(--blue)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on small{color:var(--bg);opacity:.8}
.chip:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.grid .chip{min-height:48px}
label{display:block;font-size:14px;font-weight:600;color:var(--mut);margin-bottom:12px}
input{width:100%;margin-top:5px;background:var(--surf);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:400 16px Archivo,system-ui,sans-serif;min-height:48px}
input:focus,textarea:focus{border-color:var(--blue)}
textarea{display:block;width:100%;margin-top:5px;background:var(--surf);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:400 16px Archivo,system-ui,sans-serif;min-height:84px;resize:vertical}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.go{width:100%;border:0;background:var(--acc);color:var(--on);font:700 17px Archivo,system-ui,sans-serif;border-radius:10px;padding:15px;cursor:pointer;margin-top:6px}
.go:disabled{opacity:.5}
.card{background:var(--surf);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{flex-wrap:wrap}
.wa{border:2px solid var(--blue);color:var(--blue);border-radius:8px;padding:6px 10px;font:600 14px Archivo,system-ui,sans-serif;text-decoration:none}
.card b{display:block;font-size:17px}
.sm{font-size:14px;color:var(--mut)}
.x{border:2px solid var(--line);background:none;color:var(--bad);border-radius:8px;padding:6px 10px;font:600 14px Archivo,system-ui,sans-serif;cursor:pointer}
.err{color:var(--bad);font-weight:600;min-height:20px;margin:6px 0 0}
.ok{background:var(--surf);border:2px solid var(--ink);border-radius:14px;padding:0 0 20px;text-align:center;overflow:hidden;margin-top:18px}
.ok .pole{margin-bottom:20px}
.ok h2{justify-content:center;margin-top:0;font-size:28px;font-stretch:85%}
.note{background:var(--soft);border-radius:10px;padding:14px;color:var(--mut)}
.day{text-transform:capitalize;font-size:17px;margin:24px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--acc);color:var(--on);border-radius:10px;padding:12px 14px;margin:12px 0;font-weight:600}
.alert button{border:2px solid var(--on);background:none;color:var(--on);border-radius:8px;padding:4px 10px;font:600 14px Archivo,system-ui,sans-serif;cursor:pointer}
.col{flex-direction:column;align-items:stretch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input,.row label{flex:1 1 120px}
.row input,select{margin:0;width:auto;background:var(--surf);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 10px;font:400 16px Archivo,system-ui,sans-serif;min-height:44px}
.row select{flex:1 1 110px}
.sw{display:flex;align-items:center;gap:8px;color:var(--ink);margin:0}
.sw input[type=checkbox]{width:22px;height:22px;min-height:0;margin:0;flex:none}
.wrap{position:relative}
h1{padding-right:40px}
.own{position:absolute;top:8px;right:6px;width:44px;height:44px;display:grid;place-items:center;background:none;border:0;border-radius:50%;color:var(--mut);opacity:.4;cursor:pointer;padding:0}
.own:hover,.own:focus-visible{opacity:1}
.own svg{width:20px;height:20px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="pole"></div>
<div class="wrap">
<button id="own" class="own" hidden aria-label="Acceso dueño" title="Acceso dueño" onclick="setTab('login')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></button>
<h1>Reservá tu turno</h1><p class="lead">Elegí servicio, día y horario. Te lleva un minuto.</p><nav id="nav" hidden></nav>
<main id="main"><p class="sm">Cargando…</p></main>
<p id="foot" style="text-align:center;margin-top:40px"></p>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEF={services:[{id:'s1',name:'Corte',dur:30,price:0,pt:'fijo',on:true},{id:'s2',name:'Barba',dur:30,price:0,pt:'fijo',on:true},{id:'s3',name:'Otro',dur:60,price:0,pt:'consultar',on:true}],week:{0:{on:false,from:'09:00',to:'19:00',b1:'',b2:''},1:{on:true,from:'09:00',to:'19:00',b1:'',b2:''},2:{on:true,from:'09:00',to:'19:00',b1:'',b2:''},3:{on:true,from:'09:00',to:'19:00',b1:'',b2:''},4:{on:true,from:'09:00',to:'19:00',b1:'',b2:''},5:{on:true,from:'09:00',to:'19:00',b1:'',b2:''},6:{on:true,from:'09:00',to:'19:00',b1:'',b2:''}},closures:[],consulta:true};
let cfg=JSON.parse(JSON.stringify(DEF));
const DN=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const STEP=30;
const WA='5492262629023';
const NEGOCIO='Peluquería'; // nombre que aparece en el comprobante
// ===== CONFIGURACIÓN: pegá acá los datos de tu proyecto de Firebase y tu email de dueño =====
const OWNER='tu.app.de.turnos@gmail.com';
const CFG={apiKey:'AIzaSyC8L0kuqtRrJbNE6KOY8BkzXB9BUhvq6g0',authDomain:'gestion-de-turnos-755f8.firebaseapp.com',projectId:'gestion-de-turnos-755f8',appId:'1:955811393083:web:aeebf35a69882f70cf761e'};
// =====================================================================================
let seen=null,alertMsg='';
let selD=[],cw={from:'09:00',to:'19:00',b1:'',b2:''};
let FB=null,auth=null,unsubB=null,db=null,uid=null,admin=false,ready=false,tab='res',slots={},books=[],msg='',done=null,busy=false;
let st={s:null,date:null,time:null,nm:'',ph:'',ob:''};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const key=(d,m)=>d+'_'+hm(m).replace(':','');
const mins=t=>+t.slice(0,2)*60+ +t.slice(3,5);
const fdate=d=>{const[y,m,x]=d.split('-');return new Date(+y,+m-1,+x).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})};
const closed=d=>(cfg.closures||[]).some(c=>d>=c.from&&d<=c.to);
function sch(d){const w=cfg.week[new Date(d+'T12:00:00').getDay()];return(!w||!w.on||closed(d)||mins(w.to)<=mins(w.from))?null:w}
const brk=(w,m)=>{const b1=w.b1?mins(w.b1):0,b2=w.b2?mins(w.b2):0;return b2>b1&&m<b2&&m+STEP>b1};
const act=()=>cfg.services.filter(x=>x.on);
const svc=()=>act().find(x=>x.id===st.s);
const ptxt=s=>s.pt==='consultar'?'A consultar':s.price>0?(s.pt==='desde'?'Desde ':'')+'$'+s.price.toLocaleString('es-AR'):'';
function days(){const a=[],d=new Date();for(let i=0;i<90&&a.length<14;i++){const x=iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+i));if(sch(x))a.push(x)}return a}
function free(date,m,dur){
  const w=sch(date);if(!w)return false;
  const now=new Date();
  if(date===iso(now)&&m<=now.getHours()*60+now.getMinutes())return false;
  const a=mins(w.from),z=mins(w.to),b1=w.b1?mins(w.b1):0,b2=w.b2?mins(w.b2):0;
  for(let t=m;t<m+dur;t+=STEP){if(t<a||t>=z||slots[key(date,t)]||(b2>b1&&t<b2&&t+STEP>b1))return false}
  return true;
}
function setTab(t){tab=t;done=null;render()}
function pick(k,v){st[k]=st[k]===v?null:v;if(k!=='time')st.time=null;msg='';render();if(st[k]!==null){const hs=document.querySelectorAll('#main h2'),l=hs[hs.length-1];if(l)l.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}}
async function book(){
  const sv=svc();if(!sv)return;const dur=sv.dur;
  if(!st.nm.trim()||!st.ph.trim()){msg='Completá tu nombre y tu teléfono.';return render()}
  if(st.ph.length<8){msg='Escribí un teléfono válido, solo con números.';return render()}
  if(!free(st.date,st.time,dur)){msg='Ese horario se acaba de ocupar. Elegí otro.';st.time=null;return render()}
  busy=true;msg='';render();
  const id='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const b={id,name:st.nm.trim(),phone:st.ph.trim(),service:sv.name,date:st.date,time:hm(st.time),dur,at:Date.now(),...(st.ob.trim()?{obs:st.ob.trim().slice(0,300)}:{})};
  try{
    const bt=FB.writeBatch(db);
    for(let t=st.time;t<st.time+dur;t+=STEP)bt.set(FB.doc(db,'slots',key(st.date,t)),{b:id,d:st.date});
    bt.set(FB.doc(db,'bookings',id),b);
    await bt.commit();
    done=b;st={s:0,date:null,time:null,nm:'',ph:'',ob:''};
  }catch(e){msg='No se pudo guardar. Puede que el horario se haya ocupado: elegí otro e intentá de nuevo.'}
  busy=false;render();
}
async function cancel(id){
  const b=books.find(x=>x.id===id);if(!b||!confirm('¿Cancelar el turno de '+b.name+'?'))return;
  try{
    const bt=FB.writeBatch(db);
    for(let t=mins(b.time);t<mins(b.time)+b.dur;t+=STEP)bt.delete(FB.doc(db,'slots',key(b.date,t)));
    bt.delete(FB.doc(db,'bookings',id));
    await bt.commit();
  }catch(e){alert('No se pudo cancelar. Probá de nuevo.')}
}
async function descargar(){
  const b=done;if(!b)return;
  try{await document.fonts.load('800 40px Archivo');await document.fonts.load('400 20px Archivo')}catch(e){}
  const W=720,H=900,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const F='Archivo,system-ui,-apple-system,"Segoe UI",sans-serif';
  const fit=(t,w)=>{if(g.measureText(t).width<=w)return t;while(t.length>1&&g.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'};
  g.fillStyle='#f4f6fa';g.fillRect(0,0,W,H);
  g.fillStyle='#fff';g.fillRect(40,40,640,820);
  g.save();g.beginPath();g.rect(42,42,636,30);g.clip();
  const col=['#d7263d','#fff','#1b4f9c','#fff'];
  for(let i=-2;i<24;i++){const x0=42+i*36;g.fillStyle=col[((i%4)+4)%4];g.beginPath();g.moveTo(x0,72);g.lineTo(x0+36,72);g.lineTo(x0+66,42);g.lineTo(x0+30,42);g.closePath();g.fill()}
  g.restore();
  g.strokeStyle='#14213d';g.lineWidth=4;g.strokeRect(40,40,640,820);
  g.textAlign='center';g.fillStyle='#55627d';g.font='600 20px '+F;g.fillText('COMPROBANTE DE TURNO',W/2,128);
  g.fillStyle='#14213d';g.font='800 46px '+F;g.fillText(fit(NEGOCIO,560),W/2,184);
  g.fillStyle='#d7263d';g.font='700 28px '+F;g.fillText('¡Turno confirmado!',W/2,232);
  g.strokeStyle='#d5dbe8';g.lineWidth=2;g.beginPath();g.moveTo(90,262);g.lineTo(630,262);g.stroke();
  const rows=[['SERVICIO',b.service],['FECHA',fdate(b.date)],['HORARIO',b.time+' hs'],['A NOMBRE DE',b.name],['CÓDIGO',b.id.slice(-6).toUpperCase()]];
  let y=316;
  for(const [k,v] of rows){
    g.fillStyle='#55627d';g.font='600 18px '+F;g.fillText(k,W/2,y);
    g.fillStyle='#14213d';g.font='700 32px '+F;g.fillText(fit(String(v),540),W/2,y+40);
    y+=100;
  }
  g.fillStyle='#55627d';g.font='400 19px '+F;
  g.fillText('Guardá este comprobante. Si no podés asistir,',W/2,y+10);
  g.fillText('avisanos con tiempo por WhatsApp.',W/2,y+36);
  c.toBlob(bl=>{
    if(!bl)return;
    const u=URL.createObjectURL(bl),a=document.createElement('a');
    a.href=u;a.download='turno-'+b.date+'-'+b.time.replace(':','')+'.png';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
  },'image/png');
}
const consultaChip=()=>WA&&cfg.consulta?`<a class="chip" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent('Hola, tengo una consulta.')}">Consulta<small>Por WhatsApp</small></a>`:'';
function vRes(){
  if(done)return `<div class="ok"><div class="pole"></div><h2>¡Turno confirmado!</h2><p><b>${esc(done.service)}</b><br>${esc(fdate(done.date))}, ${esc(done.time)} hs<br>a nombre de ${esc(done.name)}</p>${WA?`<a class="go" style="display:block;text-decoration:none;margin-bottom:8px" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent('Hola, reservé un turno de '+done.service+' para el '+fdate(done.date)+' a las '+done.time+' hs. Soy '+done.name+'.'+(done.obs?' Aclaración: '+done.obs:''))}">Avisar a la peluquería por WhatsApp</a>`:''}<button class="go" style="background:none;border:2px solid var(--ink);color:var(--ink);margin-bottom:8px" onclick="descargar()">Descargar comprobante</button><button class="go" style="background:var(--ink);color:var(--bg)" onclick="done=null;render()">Reservar otro turno</button></div>`;
  const A=act();if(!A.length)return '<p class="note">Por ahora no hay servicios disponibles.'+(consultaChip()?' Podés consultarnos por WhatsApp.':'')+'</p>'+(consultaChip()?'<div class="chips" style="margin-top:12px">'+consultaChip()+'</div>':'');const sv=svc(),dur=sv?sv.dur:30,D=days();
  const sel=(k,v,l,sm)=>`<div class="chips"><button class="chip on" onclick="pick('${k}','${esc(v)}')">${l}<small>${sm}</small><small style="text-decoration:underline">Cambiar</small></button></div>`;
  let h=`<h2><i>1</i>Servicio</h2>`+(sv?sel('s',sv.id,esc(sv.name),sv.dur+' min'+(ptxt(sv)?', '+ptxt(sv):'')):`<div class="chips">${A.map(s=>`<button class="chip" onclick="pick('s','${esc(s.id)}')">${esc(s.name)}<small>${s.dur} min${ptxt(s)?', '+ptxt(s):''}</small></button>`).join('')}${consultaChip()}</div>`);
  if(sv){
    h+=`<h2><i>2</i>Día</h2>`;
    if(st.date){const x=new Date(st.date+'T12:00:00');h+=sel('date',st.date,`<span style="text-transform:capitalize">${esc(x.toLocaleDateString('es-AR',{weekday:'long'}))}</span>`,x.getDate()+'/'+(x.getMonth()+1))}
    else h+=`<div class="chips">${D.map(d=>{const x=new Date(d+'T12:00:00');return `<button class="chip" onclick="pick('date','${d}')"><span style="text-transform:capitalize">${esc(x.toLocaleDateString('es-AR',{weekday:'long'}))}</span><small>${x.getDate()}/${x.getMonth()+1}</small></button>`}).join('')}</div>`;
  }
  if(sv&&st.date){
    h+=`<h2><i>3</i>Horario</h2>`;
    if(st.time!==null)h+=sel('time',st.time,hm(st.time),'');
    else{
      h+=`<div class="grid">`;
      const sc=sch(st.date);for(let m=sc?mins(sc.from):0;sc&&m<mins(sc.to);m+=STEP)if(!brk(sc,m))h+=`<button class="chip" ${free(st.date,m,dur)?'':'disabled'} onclick="pick('time',${m})">${hm(m)}</button>`;
      h+=`</div>`;
    }
  }
  if(sv&&st.date&&st.time!==null){
    h+=`<h2><i>4</i>Tus datos</h2><label>Nombre<input value="${esc(st.nm)}" oninput="st.nm=this.value" autocomplete="name"></label>
    <label>Teléfono<input type="tel" inputmode="numeric" maxlength="15" placeholder="Solo números, sin espacios" value="${esc(st.ph)}" oninput="this.value=this.value.replace(/[^0-9]/g,'');st.ph=this.value" autocomplete="tel"></label>
    <label>Aclaración u observación (opcional)<textarea rows="3" maxlength="300" placeholder="Si querés contarnos algo, escribilo acá" oninput="st.ob=this.value">${esc(st.ob)}</textarea></label>
    <p class="err">${esc(msg)}</p><button class="go" ${busy?'disabled':''} onclick="book()">${busy?'Guardando…':'Confirmar turno'}</button>`;
  }else if(msg)h+=`<p class="err">${esc(msg)}</p>`;
  return h;
}
function waNum(p){let d=String(p).replace(/\D/g,'');if(d.startsWith('54'))return d;d=d.replace(/^0+/,'');return d.length===10?'549'+d:'54'+d}
function waLink(b){const t=new Date();t.setDate(t.getDate()+1);const dia=b.date===iso(new Date())?'hoy':b.date===iso(t)?'mañana':'el '+fdate(b.date);return 'https://wa.me/'+waNum(b.phone)+'?text='+encodeURIComponent('Hola '+b.name+'! Te recordamos tu turno de '+b.service+' '+dia+' a las '+b.time+' hs. ¡Te esperamos! Si no podés venir, avisanos por acá.')}
function vAdm(){
  const today=iso(new Date()),L=books.filter(b=>b.date>=today).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  if(!L.length)return '<p class="note">No hay turnos próximos. Cuando alguien reserve, va a aparecer acá. Para cargar uno vos, usá la pestaña “Reservar”.</p>';
  let h='<p class="sm">Tocá “Recordar” y se abre WhatsApp con el mensaje listo para enviar.</p>',cur='';
  L.forEach(b=>{
    if(b.date!==cur){cur=b.date;h+=`<h3 class="day">${esc(fdate(b.date))}${b.date===today?' (hoy)':''}</h3>`}
    h+=`<div class="card"><div><b>${esc(b.time)} ${esc(b.name)}</b><span class="sm">${esc(b.service)}, ${b.dur} min, <a href="tel:${esc(b.phone)}" style="color:var(--blue)">${esc(b.phone)}</a></span>${b.obs?`<span class="sm" style="display:block">Obs.: ${esc(b.obs)}</span>`:''}</div><div class="row" style="flex:none"><a class="wa" href="${waLink(b)}" target="_blank" rel="noopener">Recordar</a><button class="x" onclick="cancel('${esc(b.id)}')">Cancelar</button></div></div>`;
  });
  return h;
}
function save(){FB.setDoc(FB.doc(db,'config','main'),cfg).catch(()=>alert('No se pudo guardar.'))}
function upd(f){f();save();render()}
function togD(d){selD=selD.includes(d)?selD.filter(x=>x!==d):[...selD,d];render()}
function rangeD(a,b){selD=[];for(let d=a;;d=(d+1)%7){selD.push(d);if(d===b)break}render()}
function applyD(on){
  if(!selD.length)return alert('Tildá al menos un día.');
  if(on&&mins(cw.to)<=mins(cw.from))return alert('El horario de cierre tiene que ser después del de apertura.');
  if(on&&(cw.b1||cw.b2)&&(!cw.b1||!cw.b2||mins(cw.b2)<=mins(cw.b1)))return alert('Revisá el descanso: completá desde y hasta.');
  upd(()=>{selD.forEach(d=>{cfg.week[d]=on?{on:true,from:cw.from,to:cw.to,b1:cw.b1,b2:cw.b2}:{...cfg.week[d],on:false}});selD=[]});
}
function addClose(){const f=$('#cf').value,t=$('#ct').value||f;if(!f||t<f)return alert('Elegí fechas válidas.');upd(()=>cfg.closures.push({from:f,to:t}))}
function vCfg(){
  const opt=(v,l,c)=>`<option value="${v}" ${v===c?'selected':''}>${l}</option>`;
  let h='<h2>Servicios y precios</h2>';
  cfg.services.forEach((s,i)=>{h+=`<div class="card col"><div class="row"><input aria-label="Nombre" value="${esc(s.name)}" onchange="upd(()=>cfg.services[${i}].name=this.value.trim()||'Servicio')"></div>
  <div class="row"><select aria-label="Duración" onchange="upd(()=>cfg.services[${i}].dur=+this.value)">${[30,60,90,120,150,180].map(d=>opt(d,d+' min',s.dur)).join('')}</select>
  <select aria-label="Tipo de precio" onchange="upd(()=>cfg.services[${i}].pt=this.value)">${opt('fijo','Precio fijo',s.pt)}${opt('desde','Desde',s.pt)}${opt('consultar','A consultar',s.pt)}</select>
  <input type="number" min="0" inputmode="numeric" aria-label="Precio" placeholder="Precio $" value="${s.price||''}" onchange="upd(()=>cfg.services[${i}].price=Math.max(0,+this.value||0))"></div>
  <div class="row"><label class="sw"><input type="checkbox" ${s.on?'checked':''} onchange="upd(()=>cfg.services[${i}].on=this.checked)"> Habilitado</label><button class="x" onclick="if(confirm('¿Eliminar este servicio?'))upd(()=>cfg.services.splice(${i},1))">Eliminar</button></div></div>`});
  h+=`<div class="card col"><div class="row"><b>Consulta por WhatsApp</b></div><p class="sm" style="margin:0">Muestra la opción “Consulta” junto a los servicios y lleva al cliente a tu WhatsApp.</p><div class="row"><label class="sw"><input type="checkbox" ${cfg.consulta?'checked':''} onchange="upd(()=>cfg.consulta=this.checked)"> Habilitado</label></div></div>`;
  h+=`<button class="go" onclick="upd(()=>cfg.services.push({id:'s'+Date.now().toString(36),name:'Nuevo servicio',dur:30,price:0,pt:'fijo',on:true}))">Agregar servicio</button><h2>Días y horarios de trabajo</h2>`;
  const O=[1,2,3,4,5,6,0],tf=(k,l)=>`<label>${l}<input type="time" value="${cw[k]}" onchange="cw.${k}=this.value"></label>`;
  h+=`<p class="sm">1. Tildá los días (o usá un atajo). 2. Elegí el horario. 3. Tocá “Aplicar”.</p><div class="chips">${O.map(d=>`<button class="chip ${selD.includes(d)?'on':''}" onclick="togD(${d})">${DN[d]}<small>${cfg.week[d].on?'Abierto':'Cerrado'}</small></button>`).join('')}</div>
  <div class="chips" style="margin-top:8px"><button class="x" onclick="rangeD(1,5)">Lun a Vie</button><button class="x" onclick="rangeD(1,6)">Lun a Sáb</button><button class="x" onclick="rangeD(2,6)">Mar a Sáb</button></div>
  <div class="card col" style="margin-top:12px"><div class="row">${tf('from','Abre')}${tf('to','Cierra')}</div><div class="row">${tf('b1','Descanso desde (opcional)')}${tf('b2','Descanso hasta')}</div>
  <div class="row"><button class="go" style="margin:0" onclick="applyD(true)">Aplicar a los días tildados</button><button class="x" onclick="applyD(false)">Cerrar los días tildados</button></div></div>
  <h3 class="day">Horarios actuales</h3>`;
  O.forEach(d=>{const w=cfg.week[d];h+=`<div class="card"><b>${DN[d]}</b><span class="sm">${w.on?w.from+' a '+w.to+(w.b1&&w.b2?', descanso '+w.b1+' a '+w.b2:''):'Cerrado'}</span></div>`});
  h+=`<h2>Cierres, vacaciones y feriados</h2><p class="sm">Para cerrar una semana, elegí del lunes al sábado. Los turnos ya reservados en esas fechas no se cancelan solos.</p><div class="row"><label>Desde<input type="date" id="cf"></label><label>Hasta<input type="date" id="ct"></label></div><button class="go" onclick="addClose()">Cerrar esas fechas</button>`;
  cfg.closures.forEach((c,i)=>{h+=`<div class="card"><span>${esc(fdate(c.from))}${c.to!==c.from?' al '+esc(fdate(c.to)):''}</span><button class="x" onclick="upd(()=>cfg.closures.splice(${i},1))">Quitar</button></div>`});
  return h;
}
function vLogin(){return `<h2>Acceso del dueño</h2><label>Email<input id="em" type="email" autocomplete="username"></label><label>Contraseña<input id="pw" type="password" autocomplete="current-password"></label><p class="err">${esc(msg)}</p><button class="go" onclick="login()">Ingresar</button><button class="x" style="margin-top:10px" onclick="setTab('res')">Volver</button>`}
async function login(){const e=$('#em').value.trim(),p=$('#pw').value;try{await FB.signInWithEmailAndPassword(auth,e,p);tab='res';msg=''}catch(x){msg='Email o contraseña incorrectos.'}render()}
function render(){
  const nav=$('#nav');nav.hidden=!admin;
  $('#own').hidden=!db||admin;
  $('#foot').innerHTML=admin?'<button class="x" style="color:var(--mut)" onclick="FB.signOut(auth)">Cerrar sesión</button>':'';
  if(admin)nav.innerHTML=`<button role="tab" aria-selected="${tab==='res'}" onclick="setTab('res')">Reservar</button><button role="tab" aria-selected="${tab==='adm'}" onclick="setTab('adm')">Agenda (${books.filter(b=>b.date>=iso(new Date())).length})</button><button role="tab" aria-selected="${tab==='cfg'}" onclick="setTab('cfg')">Ajustes</button>`;
  const m=$('#main');
  if(!ready){m.innerHTML='<p class="sm">Cargando…</p>';return}
  if(!db){m.innerHTML='<p class="note">La app todavía no está conectada a la base de datos. Falta pegar la configuración de Firebase.</p>';return}
  if(tab==='login'&&!admin){m.innerHTML=vLogin();return}
  m.innerHTML=(admin&&alertMsg?`<div class="alert" role="alert"><span>${esc(alertMsg)}</span><button onclick="alertMsg='';render()">Cerrar</button></div>`:'')+((tab==='adm'&&admin)?vAdm():(tab==='cfg'&&admin)?vCfg():vRes());
}
(async()=>{
  try{
    if(CFG.apiKey.startsWith('PEGAR'))throw 0;
    const B='https://www.gstatic.com/firebasejs/10.14.1/';
    const [A,S,T]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
    FB={...S,...T};
    const app=A.initializeApp(CFG);db=S.getFirestore(app);auth=T.getAuth(app);
    FB.onSnapshot(FB.query(FB.collection(db,'slots'),FB.where('d','>=',iso(new Date()))),q=>{slots={};q.docs.forEach(d=>slots[d.id]=1);render()},()=>{});
    FB.onSnapshot(FB.doc(db,'config','main'),sn=>{if(sn.exists()){const c=sn.data()||{};cfg={services:c.services||DEF.services,week:c.week||DEF.week,closures:c.closures||[],consulta:c.consulta!==false}}render()},()=>{});
    FB.onAuthStateChanged(auth,u=>{
      admin=!!u&&u.email===OWNER;
      if(unsubB){unsubB();unsubB=null}
      if(admin){
        unsubB=FB.onSnapshot(FB.collection(db,'bookings'),q=>{
          books=q.docs.map(d=>d.data());
          const ids=new Set(books.map(b=>b.id));
          if(seen){const n=books.filter(b=>!seen.has(b.id));if(n.length){alertMsg='Nuevo turno: '+n.map(b=>b.name+', '+b.service+', '+b.date.split('-').reverse().slice(0,2).join('/')+' '+b.time+' hs').join(' | ');try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}}
          seen=ids;render()},()=>{});
      }else{books=[];seen=null;alertMsg='';if(tab==='adm'||tab==='cfg')tab='res'}
      render();
    });
  }catch(e){db=null}
  ready=true;render();
})();
render();
</script>
</body>
</html>
